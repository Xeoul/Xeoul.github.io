# Runs the Playwright smoke tests in tests/ against the site in docs/ on
# every pull request (and on main after merging), at desktop and phone
# sizes. See playwright.config.js; run them locally with `npm test`.
name: Site checks

on:
  pull_request:
  push:
    branches: [main]

# Read-only token, and each action pinned to an exact commit (the
# version it was at is in the comment) - a tag can be moved to other
# code later, a commit can't.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - run: npm test

      - name: Keep traces of failed tests
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
